services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kubera
      POSTGRES_USER: kubera
      POSTGRES_PASSWORD: kubera_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kubera-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubera -d kubera"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kubera-postgres-data:
